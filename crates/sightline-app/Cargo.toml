[package]
name = "sightline-app"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
sightline-core = { path = "../sightline-core" }
# The winit module is unstable and may change in a minor release, so stay on 1.18.
slint = { version = "~1.18.1", features = ["unstable-winit-030"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Registry"] }

[build-dependencies]
slint-build = "1.18.1"
