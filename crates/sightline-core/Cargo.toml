[package]
name = "sightline-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
csv = "1.4.0"
encoding_rs = "0.8.42"
# Already used by the Parquet reader; here it inflates the parts of Excel workbooks.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
parquet = { version = "60.0.0", default-features = false, features = ["snap", "zstd", "flate2-rust_backend"] }
serde_json = "1.0.154"
